<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio to Text Transcription</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <p class="eyebrow">OpenAI transcription demo</p>
        <h1>Audio to Text Transcription</h1>
        <p class="intro">
          Upload an audio file and receive a transcript generated by the OpenAI API.
        </p>

        <form id="transcription-form">
          <label for="audio">Choose an audio file</label>
          <input
            id="audio"
            name="audio"
            type="file"
            accept=".flac,.mp3,.mp4,.mpeg,.mpga,.m4a,.ogg,.wav,.webm,audio/*,video/mp4,video/webm"
            required
          />
          <button type="submit">Transcribe audio</button>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <section class="result" aria-labelledby="result-heading">
          <div class="result-header">
            <h2 id="result-heading">Transcript</h2>
            <button id="copy-button" type="button" class="secondary" disabled>Copy</button>
          </div>
          <pre id="transcript">Your transcript will appear here.</pre>
        </section>
      </section>
    </main>

    <script>
      const form = document.querySelector('#transcription-form');
      const statusEl = document.querySelector('#status');
      const transcriptEl = document.querySelector('#transcript');
      const copyButton = document.querySelector('#copy-button');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const file = formData.get('audio');

        if (!file || file.size === 0) {
          statusEl.textContent = 'Please select an audio file first.';
          return;
        }

        statusEl.textContent = 'Uploading and transcribing...';
        transcriptEl.textContent = '';
        copyButton.disabled = true;
        form.querySelector('button[type="submit"]').disabled = true;

        try {
          const response = await fetch('/transcribe', {
            method: 'POST',
            body: formData,
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Transcription failed.');
          }

          transcriptEl.textContent = data.text || '(No transcript text was returned.)';
          statusEl.textContent = `Transcribed ${data.filename} with ${data.model}.`;
          copyButton.disabled = !data.text;
        } catch (error) {
          transcriptEl.textContent = 'Your transcript will appear here.';
          statusEl.textContent = error.message;
        } finally {
          form.querySelector('button[type="submit"]').disabled = false;
        }
      });

      copyButton.addEventListener('click', async () => {
        await navigator.clipboard.writeText(transcriptEl.textContent);
        statusEl.textContent = 'Transcript copied to clipboard.';
      });
    </script>
  </body>
</html>
